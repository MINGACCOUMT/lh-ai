<!DOCTYPE html>
<!-- saved from url=(0026)https://docs.ai-tudou.net/ -->
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 文档中心</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3a;
    --text: #e4e7ee;
    --muted: #9aa3b2;
    --accent: #6366f1;
    --accent-hover: #5558e3;
    --sidebar-width: 280px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* 侧边栏 */
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: var(--sidebar-width);
    height: 100vh;
    background: var(--card);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    z-index: 100;
  }
  .sidebar-header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #6366f1, #34d399);
  }
  .sidebar-header h1 {
    font-size: 1.4rem;
    color: #fff;
    margin-bottom: 4px;
  }
  .sidebar-header p {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.8);
  }

  .category {
    padding: 8px 0;
  }
  .category-title {
    padding: 12px 20px 8px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .category-title .icon {
    font-size: 1rem;
  }

  .doc-item {
    padding: 10px 20px 10px 48px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.9rem;
    color: var(--text);
    border-left: 3px solid transparent;
  }
  .doc-item:hover {
    background: rgba(99, 102, 241, 0.1);
    color: #a5b4fc;
  }
  .doc-item.active {
    background: rgba(99, 102, 241, 0.15);
    border-left-color: var(--accent);
    color: #a5b4fc;
    font-weight: 500;
  }

  /* 内容区 */
  .main-content {
    margin-left: var(--sidebar-width);
    height: 100vh;
    overflow: hidden;
  }

  .doc-frame {
    width: 100%;
    height: 100%;
    border: none;
    background: var(--bg);
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
  }
  .empty-state .icon {
    font-size: 4rem;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .empty-state h2 {
    font-size: 1.3rem;
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 0.95rem;
  }

  /* 滚动条 */
  .sidebar::-webkit-scrollbar {
    width: 6px;
  }
  .sidebar::-webkit-scrollbar-track {
    background: transparent;
  }
  .sidebar::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .sidebar::-webkit-scrollbar-thumb:hover {
    background: var(--muted);
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1>📚 API 文档中心</h1>
    <p>接口文档阅读平台</p>
  </div>
  <div id="docsList"><div class="category"><div class="category-title"><span class="icon">🎨</span><span>图像生成</span></div><div class="doc-item">GPT Image 2 图像生成</div><div class="doc-item">nano-banana图像生成</div></div><div class="category"><div class="category-title"><span class="icon">🎬</span><span>视频生成</span></div><div class="doc-item">Grok 视频生成</div><div class="doc-item">Pixverse V6 视频生成</div><div class="doc-item">sora2视频生成</div><div class="doc-item active">veo3.1视频生成</div></div><div class="category"><div class="category-title"><span class="icon">⚖️</span><span>法律条款</span></div><div class="doc-item">服务条款</div><div class="doc-item">隐私政策</div></div><div class="category"><div class="category-title"><span class="icon">📄</span><span>其他</span></div><div class="doc-item">土豆API接入codex教程</div></div></div>
</div>

<div class="main-content">
  <div id="emptyState" class="empty-state" style="display: none;">
    <div class="icon">📄</div>
    <h2>欢迎使用文档中心</h2>
    <p>请从左侧选择要查看的文档</p>
  </div>
  <iframe id="docFrame" class="doc-frame" style="display: block;" src="./API 文档中心_files/veo31-video-api-docs.html"></iframe>
</div>

<script>
  let currentDoc = null;

  // 加载文档列表
  async function loadDocs() {
    try {
      const response = await fetch('/api/docs');
      const docs = await response.json();
      renderDocs(docs);
    } catch (err) {
      console.error('加载文档列表失败:', err);
    }
  }

  // 渲染文档列表
  function renderDocs(docs) {
    const container = document.getElementById('docsList');
    container.innerHTML = '';

    for (const [category, data] of Object.entries(docs)) {
      if (data.docs.length === 0) continue;

      const categoryEl = document.createElement('div');
      categoryEl.className = 'category';

      const titleEl = document.createElement('div');
      titleEl.className = 'category-title';
      titleEl.innerHTML = `<span class="icon">${data.icon}</span><span>${category}</span>`;
      categoryEl.appendChild(titleEl);

      data.docs.forEach(doc => {
        const docEl = document.createElement('div');
        docEl.className = 'doc-item';
        docEl.textContent = doc.displayName;
        docEl.onclick = () => loadDoc(doc.fileName, docEl);
        categoryEl.appendChild(docEl);
      });

      container.appendChild(categoryEl);
    }
  }

  // 加载文档内容
  function loadDoc(fileName, element) {
    // 更新激活状态
    document.querySelectorAll('.doc-item').forEach(el => el.classList.remove('active'));
    element.classList.add('active');

    // 显示文档
    const frame = document.getElementById('docFrame');
    const emptyState = document.getElementById('emptyState');

    frame.src = `/${fileName}`;
    frame.style.display = 'block';
    emptyState.style.display = 'none';

    currentDoc = fileName;
  }

  // 初始化
  loadDocs();
</script>



</body></html>
